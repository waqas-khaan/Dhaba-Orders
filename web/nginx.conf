server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  location /health {
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
  }

  location /api/health {
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
  }

  location /api/heath {
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
  }

  location /api/menu {
    proxy_pass http://menu-api:8000/menu;
  }
  location /api/orders {
    proxy_pass http://orders-api:8080/orders;
  }
  location /api/stats {
    proxy_pass http://stats-api:8081/api/stats;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
