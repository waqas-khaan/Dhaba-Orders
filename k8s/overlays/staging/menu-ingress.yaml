
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-menu-api
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /menu
spec:
  ingressClassName: nginx
  rules:
    - host: staging.falconsoftwares.com
      http:
        paths:
          - path: /api/menu
            pathType: Exact
            backend:
              service:
                name: menu-api
                port:
                  number: 8000
