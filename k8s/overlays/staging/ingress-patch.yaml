apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: dhaba}
spec:
  rules:
    - host: staging.TEAM.test
      http:
        paths:
          - path: /api/menu
            pathType: Prefix
            backend: {service: {name: menu-api, port: {number: 8000}}}
          - path: /api/orders
            pathType: Prefix
            backend: {service: {name: orders-api, port: {number: 8080}}}
          - path: /api/stats
            pathType: Prefix
            backend: {service: {name: stats-api, port: {number: 8081}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}
