apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-stats-api
spec:
  ingressClassName: nginx
  rules:
    - host: prod.falconsoftwares.com
      http:
        paths:
          - path: /api/stats(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stats-api
                port:
                  number: 8081
          - path: /api/health(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stats-api
                port:
                  number: 8081
          - path: /api/heath(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stats-api
                port:
                  number: 8081
