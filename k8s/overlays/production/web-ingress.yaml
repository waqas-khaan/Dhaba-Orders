
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhaba-web
spec:
  ingressClassName: nginx
  rules:
    - host: prod.falconsoftwares.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
