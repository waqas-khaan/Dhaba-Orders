apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: stats-api}
  template:
    metadata:
      labels: {app: stats-api}
    spec:
      containers:
        - name: stats-api
          image: example.invalid/dhaba/stats-api:replace-me
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_ENV, value: production}
            - {name: APP_DEBUG, value: "false"}
            - {name: APP_KEY, valueFrom: {secretKeyRef: {name: dhaba-secrets, key: app-key}}}
            - {name: DB_CONNECTION, value: pgsql}
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_DATABASE, value: dhaba}
            - {name: DB_USERNAME, value: dhaba}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: dhaba-secrets, key: postgres-password}}}
            - {name: REDIS_HOST, value: redis}
            - {name: REDIS_PORT, value: "6379"}
          ports: [{containerPort: 8081}]
          readinessProbe:
            httpGet: {path: /health, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}

---
apiVersion: v1
kind: Service
metadata:
  name: stats-api
spec:
  selector: {app: stats-api}
  ports:
    - port: 8081
      targetPort: 8081

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stats-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: stats-api}
