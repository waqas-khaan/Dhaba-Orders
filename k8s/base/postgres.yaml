apiVersion: v1
kind: ConfigMap
metadata: {name: postgres-init}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS menu_items (
      id SERIAL PRIMARY KEY,
      name VARCHAR(120) NOT NULL,
      description TEXT NOT NULL DEFAULT '',
      price NUMERIC(10,2) NOT NULL CHECK (price >= 0),
      available BOOLEAN NOT NULL DEFAULT TRUE
    );
    CREATE TABLE IF NOT EXISTS orders (
      id BIGSERIAL PRIMARY KEY,
      status VARCHAR(20) NOT NULL DEFAULT 'new',
      total NUMERIC(10,2) NOT NULL DEFAULT 0,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS order_items (
      id BIGSERIAL PRIMARY KEY,
      order_id BIGINT NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
      dish_id INT NOT NULL REFERENCES menu_items(id),
      dish_name VARCHAR(120) NOT NULL,
      quantity INT NOT NULL CHECK (quantity > 0),
      unit_price NUMERIC(10,2) NOT NULL
    );
    INSERT INTO menu_items(name,description,price) VALUES
     ('Chicken Karahi','Traditional spicy chicken karahi',1450),
     ('Beef Biryani','Aromatic rice with beef',420),
     ('Chapli Kebab','Peshawari style kebab',280),
     ('Chicken Tikka','Charcoal grilled chicken',550)
    ON CONFLICT DO NOTHING;
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: dhaba}
            - {name: POSTGRES_USER, value: dhaba}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: dhaba-secrets, key: postgres-password}}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: ["sh","-c","pg_isready -U dhaba"]}, initialDelaySeconds: 5}
          livenessProbe: {exec: {command: ["sh","-c","pg_isready -U dhaba"]}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init-sql, mountPath: /docker-entrypoint-initdb.d/001-init.sql, subPath: init.sql, readOnly: true}
      volumes:
        - name: init-sql
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}
