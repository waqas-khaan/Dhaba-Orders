services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dhaba
      POSTGRES_USER: dhaba
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhaba -d dhaba"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  menu-api:
    build: ./menu-api
    environment:
      DATABASE_URL: postgresql://dhaba:local_dev_password@postgres:5432/dhaba
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: local
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  orders-api:
    build: ./orders-api
    environment:
      DATABASE_URL: postgres://dhaba:local_dev_password@postgres:5432/dhaba?sslmode=disable
      REDIS_ADDR: redis:6379
      APP_VERSION: local
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  kitchen-worker:
    build: ./kitchen-worker
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dhaba
      DB_USER: dhaba
      DB_PASSWORD: local_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_VERSION: local
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  stats-api:
    build: ./stats-api
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dhaba
      DB_USERNAME: dhaba
      DB_PASSWORD: local_dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      APP_VERSION: local
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [menu-api, orders-api, stats-api]
    networks: [backend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
