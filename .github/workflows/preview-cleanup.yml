name: Preview Cleanup

on:
  delete:

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove branch preview
    if: >
      github.event.ref_type == 'branch' &&
      github.event.ref != 'dev' &&
      github.event.ref != 'main'
    runs-on: self-hosted

    steps:
      - name: Compute branch slug
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-30 | sed 's/-$//')
          if [ -z "$SLUG" ]; then
            echo "Empty slug, nothing to clean" >&2
            exit 0
          fi
          echo "NAMESPACE=preview-$SLUG" >> "$GITHUB_ENV"
          echo "PREVIEW_HOST=br-$SLUG.falconsoftwares.com" >> "$GITHUB_ENV"

      - name: Delete namespace
        run: |
          kubectl delete namespace "$NAMESPACE" --ignore-not-found --wait=false

      - name: Remove nginx vhost
        run: |
          sudo /usr/local/bin/preview-vhost delete "$PREVIEW_HOST"
