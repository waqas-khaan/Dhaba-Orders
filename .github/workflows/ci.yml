name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "Running on self-hosted Ubuntu runner"
          hostname
          docker --version
          kubectl version --client
